services:
  dungeon-planner-server:
    build:
      context: ./server
    ports:
      - 5000:5000
    env_file: "./server/.env"
  dungeon-planner-db:
    image: postgres:17.4
    restart: always
    env_file: "./db/.env"
    ports:
      - 5432:5432
    volumes:
      - ./db/:/docker-entrypoint-initdb.d
volumes:
  pgdata: