# TODO - Add production builds. Currently only dev builds are created!
services:
  client:
    build:
      context: ./client
    ports:
      - 3000:3000
    env_file: "./client/.env.local"
    environment:
      - NODE_ENV=development
  dungeon-planner-server:
    build:
      context: ./server
    ports:
      - 8000:8000
    depends_on:
      dungeon-planner-db:
        condition: service_healthy
  dungeon-planner-db:
    image: postgres:17.4
    restart: always
    env_file: "./db/.env"
    ports:
      - 5432:5432
    volumes:
      - ./db/:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
volumes:
  pgdata: